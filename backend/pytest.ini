[pytest]
DJANGO_SETTINGS_MODULE = tymro.settings_test
python_files = test_*.py
testpaths = core/tests

# --- Velocidad del ciclo (ver backend/CLAUDE.md § Tests) -----------------
# Ni testmon ni xdist se activan por defecto a propósito: `python -m pytest`
# a secas sigue corriendo la suite COMPLETA en serie, que es lo que espera el
# pre-deploy. Los modos rápidos se piden explícitamente por CLI:
#   python -m pytest --testmon    -> solo los tests afectados por el cambio
#   python -m pytest -n auto      -> suite completa, un proceso por CPU
# `.testmondata` (mapa test -> archivos) vive en este directorio y está en
# .gitignore: es local a cada máquina y se reconstruye solo.
#
# La base es SIEMPRE Postgres (tymro-pg-verify): `tymro/settings_test.py` lo
# fija por defecto y ABORTA si no está disponible, en vez de caer a SQLite en
# silencio. No hay que exportar DATABASE_URL. Ver backend/CLAUDE.md § Tests.

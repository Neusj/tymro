services:
  backend:
    build:
      context: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-tymro-dev-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      SQLITE_DB_NAME: ${SQLITE_DB_NAME:-/data/db.sqlite3}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend,.tymroapp.com,.localhost,.trycloudflare.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://tymroapp.com,https://*.tymroapp.com,https://qa.tymroapp.com,https://*.trycloudflare.com}
      # Dominio base para resolver el subdominio de tenant (<gym>.<BASE_DOMAIN> -> org).
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-False}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://tymroapp.com,https://qa.tymroapp.com}
      # Base para armar los links públicos (registro de prueba) y los emails (verificación / reset).
      FRONTEND_URL: ${FRONTEND_URL:-https://tymroapp.com}
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-12}
      # Proxies que apendean al X-Forwarded-For delante de gunicorn. Acá son DOS
      # (cloudflared -> nginx del servicio frontend), a diferencia de Railway,
      # que es single-service y tiene sólo el edge (default 1 en settings.py).
      # Con el valor de prod, este stack contaría por la IP del contenedor de
      # nginx —la misma para todos— y el throttle de login sería un cupo global.
      NUM_PROXIES: ${NUM_PROXIES:-2}
      # EMAIL_BACKEND lo decide settings.py según DJANGO_DEBUG: consola en dev,
      # Resend (API HTTPS) en producción (DEBUG=False). NO lo fijes acá: este
      # compose también corre en QA/prod y un default a consola filtraría los
      # tokens de reset/verificación a los logs del contenedor. Configura Resend
      # vía RESEND_API_KEY.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@tymroapp.com}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/data
      - backend_media:/app/backend/media

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      - frontend
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped

volumes:
  backend_data:
  backend_media:
